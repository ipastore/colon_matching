<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error Measurement Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .controls {
            position: sticky;
            top: 0;
            background-color: #fff;
            padding: 20px 0;
            z-index: 999;
            border-bottom: 2px solid #ccc;
        }
        .controls-inner {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .input-container {
            margin: 10px;
        }
        .input-container label {
            font-weight: bold;
        }
        .plots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 40px;
            padding: 40px;
        }
        .plot {
            min-width: 400px;
            min-height: 400px;
        }
    </style>
</head>
<body>

<h1>Error Measurement Dashboard</h1>

<div class="controls">
    <div class="controls-inner">
        <div class="input-container">
            <label for="min_inliers">Min Inliers: </label>
            <input type="text" id="min_inliers" value="0">
        </div>
        <div class="input-container">
            <label for="min_parallax">Min Parallax (deg): </label>
            <input type="text" id="min_parallax" value="0.0">
        </div>
        <div class="input-container">
            <label for="min_distance">Min Distance between frames: </label>
            <input type="text" id="min_distance" value="0">
        </div>
        <div class="input-container">
            <button onclick="updatePlots()">Filter</button>
            <button onclick="resetFilters()">Reset</button>
        </div>
    </div>
</div>

<div class="plots">
    <div id="boxplot_rot" class="plot"></div>
    <div id="boxplot_trans" class="plot"></div>
    <div id="scatter_rot_inliers" class="plot"></div>
    <div id="scatter_trans_inliers" class="plot"></div>
    <div id="scatter_rot_parallax" class="plot"></div>
    <div id="scatter_trans_parallax" class="plot"></div>
</div>

<script>
// ---------- EMBEDDED DATA ----------
const data = {{DATA_JSON}};
// ------------------------------------

// Create consistent color mapping per submap_id
const uniqueSubmaps = [...new Set(data.map(d => d.submap_id))];
const colorScale = [
    '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', 
    '#9467bd', '#8c564b', '#e377c2', '#7f7f7f',
    '#bcbd22', '#17becf'
]; // D3 category10 color scale
const submapColorMap = {};
uniqueSubmaps.forEach((submap, idx) => {
    submapColorMap[submap] = colorScale[idx % colorScale.length];
});

function resetFilters() {
    document.getElementById('min_inliers').value = 0;
    document.getElementById('min_parallax').value = 0.0;
    document.getElementById('min_distance').value = 0;
    updatePlots();
}

function updatePlots() {
    const minInliers = parseFloat(document.getElementById('min_inliers').value) || 0;
    const minParallax = parseFloat(document.getElementById('min_parallax').value) || 0.0;
    const minDistance = parseFloat(document.getElementById('min_distance').value) || 0;

    const filtered = data.filter(d => d.inliers >= minInliers && d.parallax >= minParallax && d.distance_bw_frames >= minDistance);

    // Group by submap_id for boxplots
    const submapGroups = {};
    filtered.forEach(d => {
        if (!submapGroups[d.submap_id]) {
            submapGroups[d.submap_id] = [];
        }
        submapGroups[d.submap_id].push(d);
    });

    // Hover Template
    function fullHover(d) {
        return `
            image0: ${d.image0}<br>
            image1: ${d.image1}<br>
            mkpts: ${d.mkpts}<br>
            inliers: ${d.inliers}<br>
            Total_img: ${d.Total_img}<br>
            Nimg_percentage: ${d.Nimg_percentage}<br>
            parallax: ${d.parallax.toFixed(2)}<br>
            covis_score: ${d.covis_score.toFixed(3)}<br>
            rot_error: ${d.rot_error.toFixed(3)}<br>
            trans_error_deg: ${d.trans_error_deg.toFixed(3)}<br>
            trans_error_rel: ${d.trans_error_rel.toFixed(6)}<br>
            t_colmap_norm: ${d.t_colmap_norm.toFixed(4)}<br>
            mean_reprojection_error: ${d.mean_reprojection_error.toFixed(3)}<br>
            median_reprojection_error: ${d.median_reprojection_error.toFixed(3)}<br>
            std_reprojection_error: ${d.std_reprojection_error.toFixed(3)}<br>
            mean_submap_p3d_error_pre_filter: ${d.mean_submap_p3d_error_pre_filter.toFixed(3)}<br>
            median_submap_p3d_error_pre_filter: ${d.median_submap_p3d_error_pre_filter.toFixed(3)}
        `;
    }

    // Boxplot rot_error traces
    const boxRotTraces = Object.keys(submapGroups).map(submap => ({
        y: submapGroups[submap].map(d => d.rot_error),
        name: submap,
        type: 'box',
        boxpoints: 'all',
        jitter: 0.3,
        pointpos: -1.8,
        marker: { color: submapColorMap[submap] },
        hovertext: submapGroups[submap].map(fullHover),
        hoverinfo: 'text'
    }));

    Plotly.react('boxplot_rot', boxRotTraces, {
        title: 'Rotation Error by Submap',
        yaxis: { 
            title: 'Rotation Error (deg)',
            range: [0, Math.max(...data.map(d => d.rot_error)) * 1.1]
        },
        boxmode: 'group',
        uirevision: 'true'
    });

    // Boxplot trans_error_deg traces
    const boxTransTraces = Object.keys(submapGroups).map(submap => ({
        y: submapGroups[submap].map(d => d.trans_error_deg),
        name: submap,
        type: 'box',
        boxpoints: 'all',
        jitter: 0.3,
        pointpos: -1.8,
        marker: { color: submapColorMap[submap] },
        hovertext: submapGroups[submap].map(fullHover),
        hoverinfo: 'text'
    }));

    Plotly.react('boxplot_trans', boxTransTraces, {
        title: 'Translation Error by Submap',
        yaxis: { 
            title: 'Translation Error (deg)',
            range: [0, Math.max(...data.map(d => d.trans_error_deg)) * 1.1]
        },
        boxmode: 'group',
        uirevision: 'true'
    });

    // // Scatter plots
    // function scatterPlot(xField, yField, title, divId) {
    //     const xMax = Math.max(...data.map(d => d[xField])) * 1.05;
    //     const yMax = Math.max(...data.map(d => d[yField])) * 1.05;
        
    //     Plotly.react(divId, [{
    //         x: filtered.map(d => d[xField]),
    //         y: filtered.map(d => d[yField]),
    //         mode: 'markers',
    //         type: 'scatter',
    //         marker: {
    //             size: 8,
    //             color: filtered.map(d => submapColorMap[d.submap_id]),
    //         },
    //         hovertext: filtered.map(fullHover),
    //         hoverinfo: 'text'
    //     }], {
    //         title: title,
    //         xaxis: { 
    //             title: xField,
    //             range: [0, xMax]
    //         },
    //         yaxis: { 
    //             title: yField,
    //             range: [0, yMax]
    //         },
    //         uirevision: 'true'
    //     });
    // }

    function scatterPlot(xField, yField, title, divId) {
        const xMax = Math.max(...data.map(d => d[xField])) * 1.05;
        const yMax = Math.max(...data.map(d => d[yField])) * 1.05;
    
        // Create scatter plot traces grouped by submap_id
        const scatterTraces = Object.keys(submapGroups).map(submap => ({
            x: submapGroups[submap].map(d => d[xField]),
            y: submapGroups[submap].map(d => d[yField]),
            mode: 'markers',
            type: 'scatter',
            name: submap, // Submap name for legend interactivity
            marker: {
                size: 8,
                color: submapColorMap[submap],
            },
            hovertext: submapGroups[submap].map(fullHover),
            hoverinfo: 'text'
        }));
        
        // Render the scatter plot with grouped traces
        Plotly.react(divId, scatterTraces, {
            title: title,
            xaxis: { 
                title: xField,
                range: [0, xMax]
            },
            yaxis: { 
                title: yField,
                range: [0, yMax]
            },
            uirevision: 'true',
            showlegend: true // Enable legend for interactivity
        });
    }

    scatterPlot('inliers', 'rot_error', 'Rotation Error vs Inliers', 'scatter_rot_inliers');
    scatterPlot('inliers', 'trans_error_deg', 'Translation Error vs Inliers', 'scatter_trans_inliers');
    scatterPlot('parallax', 'rot_error', 'Rotation Error vs Parallax', 'scatter_rot_parallax');
    scatterPlot('parallax', 'trans_error_deg', 'Translation Error vs Parallax', 'scatter_trans_parallax');
}

// Initial plot
updatePlots();
</script>

</body>
</html>
