[pytest]
# Only look here for tests
testpaths = tests

# Standard discovery rules
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# # Do not recurse into third-party/vendor code or build dirs
norecursedirs = tools .git .venv venv build dist .* __pycache__

# # Nice defaults: quiet + show summary of skips/xfails
addopts = -q -ra

# (Optional) if you ever suspect plugin issues, run with:
#   PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest
