<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Error Measurement Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        h1 {
            text-align: center;
            margin-top: 20px;
        }
        .controls {
            position: sticky;
            top: 0;
            background-color: #fff;
            padding: 20px 0;
            z-index: 999;
            border-bottom: 2px solid #ccc;
        }
        .controls-inner {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .input-container {
            margin: 10px;
        }
        .input-container label {
            font-weight: bold;
        }
        .plots {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 40px;
            padding: 40px;
        }
        .plot {
            min-width: 400px;
            min-height: 400px;
        }
        .summary-section {
            padding: 20px 40px;
            margin-bottom: 20px;
        }
        
        .summary-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .summary-table th, .summary-table td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        
        .summary-table th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        
        .summary-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        
        .summary-table tr:hover {
            background-color: #f0f0f0;
        }        
    </style>
</head>
<body>
    
    <h1 id="model-sequence">Model: <span id="model-name"></span>, Sequence: <span id="sequence-name"></span></h1>

<div class="controls">
    <div class="controls-inner">
        <div class="input-container">
            <label for="min_inliers">Min Inliers: </label>
            <input type="text" id="min_inliers" value="0">
        </div>
        <div class="input-container">
            <label for="min_parallax">Min Parallax (deg): </label>
            <input type="text" id="min_parallax" value="0.0">
        </div>
        <div class="input-container">
            <label for="min_distance">Min Distance between frames: </label>
            <input type="text" id="min_distance" value="0">
        </div>
        <div class="input-container">
            <button onclick="updatePlots()">Filter</button>
            <button onclick="resetFilters()">Reset</button>
        </div>
    </div>
</div>

<div class="summary-section">
    <h2>Submap Summary</h2>
    <table id="summary-table" class="summary-table">
        <thead>
            <tr>
                <th>Submap ID</th>
                <th>Total Pairs</th>
                <th>Registered Pairs</th>
                <th>mAA</th>
                <th>Mean P3D Error</th>
                <th>Median P3D Error</th>
            </tr>
        </thead>
        <tbody id="summary-tbody">
            <!-- Will be filled by JavaScript -->
        </tbody>
    </table>
</div>

<div class="plots">
    <div id="boxplot_rot" class="plot"></div>
    <div id="boxplot_trans" class="plot"></div>
    <div id="scatter_rot_inliers" class="plot"></div>
    <div id="scatter_trans_inliers" class="plot"></div>
    <div id="scatter_rot_parallax" class="plot"></div>
    <div id="scatter_trans_parallax" class="plot"></div>
    <div id="scatter_rot_reprojection" class="plot"></div>
    <div id="scatter_trans_reprojection" class="plot"></div>


</div>

// Extract model_name and seq from the first item in the data array
document.addEventListener('DOMContentLoaded', () => {
    if (data.length > 0) {
        const firstItem = data[0];
        document.getElementById('model-name').textContent = firstItem.model_name || "Unknown";
        document.getElementById('sequence-name').textContent = firstItem.sequence || "Unknown";
    }
});


// Create consistent color mapping per submap_id
const uniqueSubmaps = [...new Set(data.map(d => d.submap_id))];
const colorScale = [
    '#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', 
    '#9467bd', '#8c564b', '#e377c2', '#7f7f7f',
    '#bcbd22', '#17becf'
]; // D3 category10 color scale
const submapColorMap = {};
uniqueSubmaps.forEach((submap, idx) => {
    submapColorMap[submap] = colorScale[idx % colorScale.length];
});

function resetFilters() {
    document.getElementById('min_inliers').value = 0;
    document.getElementById('min_parallax').value = 0.0;
    document.getElementById('min_distance').value = 0;
    updatePlots();
}

function updateSummaryTable() {
    // Group data by submap and calculate summary statistics
    const submapSummary = {};
    
    data.forEach(d => {
        if (!submapSummary[d.submap_id]) {
            submapSummary[d.submap_id] = {
                submap_id: d.submap_id,
                Total_img: d.Total_img,
                Nimg_percentage: d.Nimg_percentage,
                mAA: d.mAA,
                mean_submap_p3d_error_pre_filter: d.mean_submap_p3d_error_pre_filter,
                median_submap_p3d_error_pre_filter: d.median_submap_p3d_error_pre_filter,
            };
        }
    });
    
    // Sort submaps numerically
    const sortedSubmaps = Object.values(submapSummary).sort((a, b) => 
        parseInt(a.submap_id) - parseInt(b.submap_id)
    );
    
    // Build the table HTML
    const tbody = document.getElementById('summary-tbody');
    tbody.innerHTML = '';
    
    sortedSubmaps.forEach(submap => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td>${submap.submap_id}</td>
            <td>${submap.Total_img}</td>
            <td>${submap.Nimg_percentage.toFixed(2)}%</td>
            <td>${submap.mAA ? submap.mAA.toFixed(4) : 'N/A'}</td>
            <td>${submap.mean_submap_p3d_error_pre_filter ? submap.mean_submap_p3d_error_pre_filter.toFixed(4) : 'N/A'}</td>
            <td>${submap.median_submap_p3d_error_pre_filter ? submap.median_submap_p3d_error_pre_filter.toFixed(4) : 'N/A'}</td>
        `;
        
        // Use the same color coding as in the plots
        row.style.borderLeft = `5px solid ${submapColorMap[submap.submap_id]}`;
        
        tbody.appendChild(row);
    });
}

function updatePlots() {
    const minInliers = parseFloat(document.getElementById('min_inliers').value) || 0;
    const minParallax = parseFloat(document.getElementById('min_parallax').value) || 0.0;
    const minDistance = parseFloat(document.getElementById('min_distance').value) || 0;

    const filtered = data.filter(d => d.inliers >= minInliers && d.parallax >= minParallax && d.distance_bw_frames >= minDistance);

    // Group by submap_id for boxplots
    const submapGroups = {};
    filtered.forEach(d => {
        if (!submapGroups[d.submap_id]) {
            submapGroups[d.submap_id] = [];
        }
        submapGroups[d.submap_id].push(d);
    });

    updateSummaryTable();

    // Hover Template
    function fullHover(d) {
        return `
            image0: ${d.image0}<br>
            image1: ${d.image1}<br>
            mkpts: ${d.mkpts}<br>
            inliers: ${d.inliers}<br>
            Total_img: ${d.Total_img}<br>
            Nimg_percentage: ${d.Nimg_percentage}<br>
            parallax: ${d.parallax.toFixed(2)}<br>
            covis_score: ${d.covis_score.toFixed(3)}<br>
            rot_error: ${d.rot_error.toFixed(3)}<br>
            trans_error_deg: ${d.trans_error_deg.toFixed(3)}<br>
            trans_error_rel: ${d.trans_error_rel.toFixed(6)}<br>
            t_colmap_norm: ${d.t_colmap_norm.toFixed(4)}<br>
            mean_reprojection_error: ${d.mean_reprojection_error.toFixed(3)}<br>
            median_reprojection_error: ${d.median_reprojection_error.toFixed(3)}<br>
            std_reprojection_error: ${d.std_reprojection_error.toFixed(3)}<br>
            n_3d_colmap_points: ${d.n_3d_colmap_points}<br>
        `;
    }

    // TODO: Other Hover texts


    // Function for boxplots
    function boxPlot(yField, title, divId, hoverField = 'fullHover') {
        const yMax = Math.max(...data.map(d => d[yField])) * 1.05;
        
        // Create box plot traces grouped by submap_id
        const boxTraces = Object.keys(submapGroups).map(submap => {
            // Base trace configuration
            const trace = {
                y: submapGroups[submap].map(d => d[yField]),
                name: submap,
                type: 'box',
                boxpoints: 'all',
                jitter: 0.3,
                pointpos: -1.8,
                marker: { color: submapColorMap[submap] }
            };
            
            // Add hover info only if not set to 'none'
            if (hoverField !== 'none') {
                trace.hovertext = submapGroups[submap].map(fullHover);
                trace.hoverinfo = 'text';
            }
            
            return trace;
        });
        
        // Render the box plot with grouped traces
        Plotly.react(divId, boxTraces, {
            title: title,
            yaxis: { 
                title: yField,
                range: [0, yMax]
            },
            xaxis: {
                type: 'category',  // This is the key change - treat x-axis as categorical
                categoryorder: 'array',
                categoryarray: Object.keys(submapGroups).sort((a, b) => 
                    parseInt(a) - parseInt(b)
                )
            },
            boxmode: 'group',
            uirevision: 'true'
        });
    }

    boxPlot('rot_error', 'Rotation Error by Submap', 'boxplot_rot');
    boxPlot('trans_error_deg', 'Translation Error by Submap', 'boxplot_trans');
    // boxPlot('submap_p3d_errors_pre_filter', 'P3D Errors by Submap', 'boxplot_p3d_errors', "none"); // Takes to long, instead make a correlation for each image_pair

    function scatterPlot(xField, yField, title, divId) {
        const xMax = Math.max(...data.map(d => d[xField])) * 1.05;
        const yMax = Math.max(...data.map(d => d[yField])) * 1.05;
    
        // Create scatter plot traces grouped by submap_id
        const scatterTraces = Object.keys(submapGroups).map(submap => ({
            x: submapGroups[submap].map(d => d[xField]),
            y: submapGroups[submap].map(d => d[yField]),
            mode: 'markers',
            type: 'scatter',
            name: submap, // Submap name for legend interactivity
            marker: {
                size: 8,
                color: submapColorMap[submap],
            },
            hovertext: submapGroups[submap].map(fullHover),
            hoverinfo: 'text'
        }));
        
        // Render the scatter plot with grouped traces
        Plotly.react(divId, scatterTraces, {
            title: title,
            xaxis: { 
                title: xField,
                range: [0, xMax]
            },
            yaxis: { 
                title: yField,
                range: [0, yMax]
            },
            uirevision: 'true',
            showlegend: true // Enable legend for interactivity
        });
    }

    scatterPlot('inliers', 'rot_error', 'Rotation Error vs Inliers', 'scatter_rot_inliers');
    scatterPlot('inliers', 'trans_error_deg', 'Translation Error vs Inliers', 'scatter_trans_inliers');
    scatterPlot('parallax', 'rot_error', 'Rotation Error vs Parallax', 'scatter_rot_parallax');
    scatterPlot('parallax', 'trans_error_deg', 'Translation Error vs Parallax', 'scatter_trans_parallax');
    scatterPlot('mean_reprojection_error', 'rot_error', 'Rotation Error vs Mean Reprojection Error', 'scatter_rot_reprojection');
    scatterPlot('mean_reprojection_error', 'trans_error_deg', 'Translation Error vs Mean Reprojection Error', 'scatter_trans_reprojection');
}

// Initial plot
updatePlots();
</script>
