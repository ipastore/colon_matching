name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  # MUST be named exactly this
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout (with submodules; LFS OFF)
        uses: actions/checkout@v5
        with:
          submodules: recursive
          # lfs: false
          # NOTE: Copilot may override fetch-depth for safety/rollback.  # FYI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Avoid LFS smudge (keep LFS disabled)
        run: git lfs install --skip-smudge || true

      - name: Sync & init submodules to recorded SHAs
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install Python deps (root)
        run: |
          python -m pip install -U pip setuptools wheel
          pip install -e .
          
      - name : Run tests
        run: |
          pytest -q
          
    #   - name: Install Python deps (IMM)
    #     run: |
    #       pip install -e tools/image-matching_models[all]
            
      # Turn this on only if a run fails due to missing shared libs (OpenCV/Open3D)
      - name: (Optional) Install system libs
        if: ${{ false }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0
